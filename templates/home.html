<header id="about" class="intro" aria-labelledby="intro-name">
  <img class="portrait" src="{{photo}}" alt="{{name}}" width="190" height="228" fetchpriority="high">
  <div class="intro-text">
    <h1 id="intro-name">{{name}}</h1>
    <p class="intro-role">{{role}} · <a href="{{affiliationUrl}}">{{affiliation}}</a></p>
    <!-- 简介正文在 content/about.html，不要写在这里。 -->
    {{about}}
    <div class="social-links" aria-label="Contact and profiles">{{socialLinks}}</div>
  </div>
</header>
<section id="research" class="research-section" aria-labelledby="research-title">
  <h2 id="research-title">Research</h2>
  <div class="publications">{{publications}}</div>
</section>
<section class="contact-section" aria-labelledby="contact-title">
  <h2 id="contact-title">Contact</h2>
  <!-- 这句留在模板里：邮箱地址由 profile.json 的 links.email 生成，
       搬到 content/ 就要把地址再抄一遍，改一处漏一处。 -->
  <p>I’m happy to chat about human–robot interaction, robot learning, and
    possible collaborations.</p>
</section>
