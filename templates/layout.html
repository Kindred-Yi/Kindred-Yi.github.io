<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>{{title}}</title>
  <meta name="description" content="{{description}}">
  <link rel="canonical" href="{{canonical}}">
  <meta property="og:type" content="{{ogType}}">
  <meta property="og:title" content="{{title}}">
  <meta property="og:description" content="{{description}}">
  <meta property="og:url" content="{{canonical}}">
  <meta property="og:image" content="{{imageUrl}}">
  <link rel="icon" href="/assets/favicon.svg" type="image/svg+xml">
  <script src="/assets/theme.js"></script>
  <link rel="stylesheet" href="/assets/style.css">
</head>
<body>
  <a class="skip-link" href="#main">Skip to content</a>
  <header class="site-header">
    <div class="header-inner">
      <a class="wordmark" href="/">{{name}}<span class="wordmark-dot" aria-hidden="true">.</span></a>
      <nav aria-label="Main navigation">
        <a href="/#about"{{aboutCurrent}}>About</a>
        <a href="/#research">Research</a>
        <a href="/blog/"{{blogCurrent}}>Blog</a>
      </nav>
      <button class="theme-toggle" type="button" aria-label="Switch color theme" title="Switch color theme" hidden>
        <svg class="sun" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2m0 16v2M2 12h2m16 0h2M5 5l1.5 1.5m11 11L19 19M5 19l1.5-1.5m11-11L19 5"/></svg>
        <svg class="moon" viewBox="0 0 24 24" aria-hidden="true"><path d="M20.5 14A8.5 8.5 0 0 1 10 3.5 8.5 8.5 0 1 0 20.5 14Z"/></svg>
      </button>
    </div>
  </header>
  <main id="main" class="site-main" tabindex="-1">{{content}}</main>
  <footer class="site-footer">
    <span>© {{year}} {{name}}</span>
    <span>Human–robot interaction &amp; robot learning</span>
  </footer>
</body>
</html>
